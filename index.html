<title>ぬけ!ざっそう</title>
<style>
  :root {
    --sky-top: #bde0fe;
    --sky-bottom: #8ecae6;
    --grass: #6a994e;
    --grass-dark: #386641;
    --soil: #a9744f;
    --sun: #ffb703;
    --sun-dark: #fb8500;
    --forbidden: #e63946;
    --panel: #fefae0;
    --panel-border: #e9d8a6;
    --ink: #283618;
    --ink-soft: #5c6b3f;
    --locked: rgba(40, 54, 24, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #14213d;
      --sky-bottom: #1b2a4a;
      --grass: #386641;
      --grass-dark: #1f3d24;
      --soil: #6b4a34;
      --sun: #ffb703;
      --sun-dark: #fb8500;
      --forbidden: #ef476f;
      --panel: #22301a;
      --panel-border: #3a4a2a;
      --ink: #f1f5e6;
      --ink-soft: #c8d3ac;
      --locked: rgba(241, 245, 230, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --sky-top: #14213d;
    --sky-bottom: #1b2a4a;
    --grass: #386641;
    --grass-dark: #1f3d24;
    --soil: #6b4a34;
    --sun: #ffb703;
    --sun-dark: #fb8500;
    --forbidden: #ef476f;
    --panel: #22301a;
    --panel-border: #3a4a2a;
    --ink: #f1f5e6;
    --ink-soft: #c8d3ac;
    --locked: rgba(241, 245, 230, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding-inline: 16px;
    padding-block: 16px;
  }

  h1, .score-num, .level-badge, .toast, .btn {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
    flex: 1;
  }

  .avatar {
    font-size: 2rem;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .hud {
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hud-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .level-badge {
    background: var(--sun);
    color: var(--ink);
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 1rem;
  }

  .score-num {
    font-weight: 700;
    font-size: 1.1rem;
  }

  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--panel-border) 60%, transparent);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sun), var(--sun-dark));
    width: 0%;
    transition: width 0.4s ease;
  }

  .toast {
    min-height: 1.4em;
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink-soft);
    transition: opacity 0.2s ease;
  }

  .field {
    position: relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.15), transparent 60%),
      var(--grass);
    border: 3px solid var(--grass-dark);
    border-radius: 18px;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 10px;
    min-height: 300px;
    align-content: start;
  }

  .plot {
    position: relative;
    aspect-ratio: 1;
    border: none;
    border-radius: 14px;
    background: var(--soil);
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease;
  }

  .plot:active { transform: scale(0.92); }

  .plot.locked { filter: grayscale(0.6); opacity: 0.75; }
  .plot.locked::after {
    content: '🔒';
    position: absolute;
    font-size: 0.9rem;
    bottom: 2px;
    right: 4px;
  }

  .plot.pulled {
    animation: pop 0.28s ease forwards;
    pointer-events: none;
  }

  .plot.rejected {
    animation: shake 0.35s ease;
  }

  @keyframes pop {
    to { transform: scale(0); opacity: 0; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px) rotate(-4deg); }
    75% { transform: translateX(6px) rotate(4deg); }
  }

  .float-text {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    font-weight: 700;
    font-size: 0.95rem;
    pointer-events: none;
    animation: float-up 0.9s ease forwards;
    white-space: nowrap;
  }

  .float-text.gain { color: #2d6a4f; }
  .float-text.loss { color: var(--forbidden); }

  @keyframes float-up {
    0% { opacity: 1; top: 0; }
    100% { opacity: 0; top: -34px; }
  }

  .actions {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 700;
    background: var(--sun-dark);
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn:active { transform: scale(0.96); }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    font: inherit;
    cursor: pointer;
    padding: 4px;
  }

  .levelup-banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .levelup-banner span {
    background: var(--sun);
    color: var(--ink);
    font-weight: 700;
    font-size: 1.4rem;
    padding: 14px 28px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    animation: banner-pop 1.1s ease forwards;
  }

  @keyframes banner-pop {
    0% { opacity: 0; transform: scale(0.6); }
    15% { opacity: 1; transform: scale(1.05); }
    25% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

<div class="app">
  <header>
    <div class="avatar" id="avatar">🧒</div>
    <h1>ぬけ!ざっそう</h1>
  </header>

  <div class="hud">
    <div class="hud-row">
      <span class="level-badge" id="levelBadge">Lv.1</span>
      <span class="score-num" id="scoreNum">0 ポイント</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="field" id="field"></div>

  <div class="actions">
    <button class="btn" id="newFieldBtn" hidden>つぎのはたけ</button>
  </div>

  <footer>
    ためしバージョン ・
    <button class="reset-link" id="resetBtn">さいしょからやりなおす</button>
  </footer>
</div>

<div class="levelup-banner" id="levelupBanner"></div>

<script>
(() => {
  const STORAGE_KEY = 'zassou-game-save-v1';

  const WEED_TIERS = [
    { unlockLevel: 1, emoji: '🌱', name: 'ちいさい雑草', points: 10 },
    { unlockLevel: 2, emoji: '🌿', name: 'ふつうの雑草', points: 20 },
    { unlockLevel: 3, emoji: '🍀', name: 'おおきい雑草', points: 35 },
  ];

  const FORBIDDEN = { emoji: '🌷', name: 'おはな', penalty: 15 };

  const LEVELS = [
    { level: 1, needPoints: 0, avatar: '🧒' },
    { level: 2, needPoints: 50, avatar: '👦' },
    { level: 3, needPoints: 130, avatar: '🧑' },
  ];

  const MAX_LEVEL = LEVELS[LEVELS.length - 1].level;

  const els = {
    field: document.getElementById('field'),
    levelBadge: document.getElementById('levelBadge'),
    scoreNum: document.getElementById('scoreNum'),
    progressFill: document.getElementById('progressFill'),
    toast: document.getElementById('toast'),
    newFieldBtn: document.getElementById('newFieldBtn'),
    resetBtn: document.getElementById('resetBtn'),
    avatar: document.getElementById('avatar'),
    levelupBanner: document.getElementById('levelupBanner'),
  };

  function loadPoints() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return parsed && typeof parsed.points === 'number' ? parsed.points : 0;
    } catch {
      return 0;
    }
  }

  function savePoints(points) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ points }));
    } catch {}
  }

  let points = loadPoints();
  let level = computeLevel(points);
  let cellsLeft = 0;

  function computeLevel(pts) {
    let lvl = LEVELS[0];
    for (const entry of LEVELS) {
      if (pts >= entry.needPoints) lvl = entry;
    }
    return lvl.level;
  }

  function levelInfo(lvl) {
    return LEVELS.find((l) => l.level === lvl) || LEVELS[0];
  }

  function nextLevelInfo(lvl) {
    return LEVELS.find((l) => l.level === lvl + 1) || null;
  }

  function updateHud() {
    els.levelBadge.textContent = `Lv.${level}`;
    els.scoreNum.textContent = `${points} ポイント`;
    els.avatar.textContent = levelInfo(level).avatar;

    const next = nextLevelInfo(level);
    if (!next) {
      els.progressFill.style.width = '100%';
    } else {
      const cur = levelInfo(level).needPoints;
      const span = next.needPoints - cur;
      const ratio = Math.max(0, Math.min(1, (points - cur) / span));
      els.progressFill.style.width = `${ratio * 100}%`;
    }
  }

  function showToast(text) {
    els.toast.textContent = text;
  }

  function pickWeedTierIndex(maxUnlockedTier) {
    const upper = Math.min(maxUnlockedTier + 1, WEED_TIERS.length - 1);
    const roll = Math.random();
    if (roll < 0.15 && upper > maxUnlockedTier) return upper;
    return Math.floor(Math.random() * (maxUnlockedTier + 1));
  }

  function generateField() {
    els.field.innerHTML = '';
    els.newFieldBtn.hidden = true;

    const maxUnlockedTier = WEED_TIERS.reduce(
      (acc, tier, idx) => (tier.unlockLevel <= level ? idx : acc), 0
    );

    const totalCells = 12;
    const forbiddenCount = 3;
    const cells = [];

    for (let i = 0; i < forbiddenCount; i++) {
      cells.push({ type: 'forbidden' });
    }
    for (let i = forbiddenCount; i < totalCells; i++) {
      cells.push({ type: 'weed', tierIndex: pickWeedTierIndex(maxUnlockedTier) });
    }

    shuffle(cells);
    cellsLeft = cells.filter(
      (c) => c.type === 'weed' && WEED_TIERS[c.tierIndex].unlockLevel <= level
    ).length;

    cells.forEach((cell) => renderCell(cell));
    showToast('ぬいてもいいざっそうを　みつけてタップしてね');
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function renderCell(cell) {
    const plot = document.createElement('button');
    plot.className = 'plot';
    plot.type = 'button';

    if (cell.type === 'forbidden') {
      plot.textContent = FORBIDDEN.emoji;
      plot.dataset.type = 'forbidden';
    } else {
      const tier = WEED_TIERS[cell.tierIndex];
      plot.textContent = tier.emoji;
      plot.dataset.type = 'weed';
      plot.dataset.tier = cell.tierIndex;
      if (tier.unlockLevel > level) plot.classList.add('locked');
    }

    plot.addEventListener('click', () => onPlotTap(plot));
    els.field.appendChild(plot);
  }

  function floatText(plot, text, cls) {
    const span = document.createElement('span');
    span.className = `float-text ${cls}`;
    span.textContent = text;
    plot.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
  }

  function onPlotTap(plot) {
    if (plot.classList.contains('pulled')) return;

    if (plot.dataset.type === 'forbidden') {
      floatText(plot, `-${FORBIDDEN.penalty}`, 'loss');
      plot.classList.add('rejected');
      applyPoints(-FORBIDDEN.penalty);
      showToast(`それは${FORBIDDEN.name}!　ぬいちゃダメだよ`);
      plot.classList.add('pulled');
      plot.addEventListener('animationend', () => plot.remove(), { once: true });
      return;
    }

    const tierIndex = Number(plot.dataset.tier);
    const tier = WEED_TIERS[tierIndex];

    if (tier.unlockLevel > level) {
      plot.classList.add('rejected');
      showToast(`まだ Lv.${tier.unlockLevel} にならないと ぬけないよ`);
      setTimeout(() => plot.classList.remove('rejected'), 350);
      return;
    }

    floatText(plot, `+${tier.points}`, 'gain');
    plot.classList.add('pulled');
    applyPoints(tier.points);
    showToast(`${tier.name}を ぬいた!`);
    cellsLeft -= 1;
    plot.addEventListener('animationend', () => {
      plot.remove();
      if (cellsLeft <= 0) els.newFieldBtn.hidden = false;
    }, { once: true });
  }

  function applyPoints(delta) {
    const before = level;
    points = Math.max(0, points + delta);
    level = computeLevel(points);
    savePoints(points);
    updateHud();
    updateLockedCells();

    if (level > before) celebrateLevelUp();
    else if (level < before) showToast(`ポイントが へって Lv.${level} に もどっちゃった…`);
  }

  function updateLockedCells() {
    document.querySelectorAll('.plot[data-type="weed"]').forEach((plot) => {
      const tier = WEED_TIERS[Number(plot.dataset.tier)];
      const nowLocked = tier.unlockLevel > level;
      plot.classList.toggle('locked', nowLocked);
    });
    cellsLeft = document.querySelectorAll('.plot[data-type="weed"]:not(.locked)').length;
    if (cellsLeft <= 0 && els.field.children.length > 0) {
      els.newFieldBtn.hidden = false;
    }
  }

  function celebrateLevelUp() {
    const span = document.createElement('span');
    span.textContent = `レベルアップ! Lv.${level}になった!`;
    els.levelupBanner.innerHTML = '';
    els.levelupBanner.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
  }

  els.newFieldBtn.addEventListener('click', generateField);

  els.resetBtn.addEventListener('click', () => {
    points = 0;
    level = 1;
    savePoints(points);
    updateHud();
    generateField();
  });

  updateHud();
  generateField();
})();
</script>
